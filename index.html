<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Tailwind Css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="styles/style.css" />
    <title>Tea House</title>
  </head>
  <body class="manrope">
    <header class="max-w-7xl mx-auto mt-20">
      <div class="flex gap-36">
        <div class="">
          <h1 class="text-7xl font-extrabold">It's good <br>tea time at The <br>Tea House</h1>
          <p class="text-[#777777] my-10">
            Tea and Botanical Solutions Supplier Give Optimum Satisfaction To
            Your Taste Buds.
          </p>
          <button class="h-16 w-52 text-white bg-gradient-to-r from-[#ff8335] to-[#ff0904] rounded-2xl">Explore More <i class="fa-solid fa-arrow-right-long -rotate-45"></i></button>
        </div>
        <div class="relative">
          <img class="relative top-24" src="./images/banner.png" alt="banner" />
          <div class="flex items-center gap-4 w-50 p-2 rounded-2xl shadow-lg bg-white absolute left-28">
            <i class="fa-solid fa-star text-2xl"></i>
            <div>
              <h1>5.00</h1>
              <p class="text-[#777777]">Trust Pilot Ratings</p>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main></main>
    <footer></footer>
  </body>
</html>
